                    amount:
                      amountMinor: 400000
                      currency: UAH
                    count: 5
                  - method: card
                    amount:
                      amountMinor: 850000
                      currency: UAH
                    count: 10
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidPeriod'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/reports/popular-services:
    get:
      operationId: getPopularServicesReport
      summary: Most booked services for a period
      description: |
        Ranked by booking count descending, then by service name ascending
        (REQ-F-032, D16).
      tags: [Reports]
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [day, week, month]
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Ranked services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopularServicesReport'
              example:
                period: month
                from: '2026-10-01'
                to: '2026-10-31'
                items:
                  - rank: 1
                    serviceId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: Haircut
                    bookingsCount: 42
                  - rank: 2
                    serviceId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                    name: Styling
                    bookingsCount: 17
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/InvalidPeriod'
        '500':
          $ref: '#/components/responses/InternalError'
  /admin/reports/stock-levels:
    get:
      operationId: getStockLevelsReport
      summary: Current stock levels
      description: A snapshot; intentionally has no period parameter (REQ-F-033).
      tags: [Reports]
      responses:
        '200':
          description: Current levels per material.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockLevelsReport'
              example:
                asOf: '2026-11-03T12:00:00+02:00'
                items:
                  - materialId: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                    name: Shampoo
                    unit: ml
                    quantity: 160
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT issued by `POST /auth/login`. Required on Master, Admin and Reports
        operations; public operations override with `security: []`. Client
        booking access uses the appointment token in the path, not this scheme.
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Page size; maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MasterId:
      name: masterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AccessToken:
      name: token
      in: path
      required: true
      description: Client access token (REQ-NF-001).
      schema:
        type: string
        format: uuid
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MasterServiceId:
      name: masterServiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MaterialId:
      name: materialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    MalformedRequest:
      description: The request could not be parsed or a query parameter has the wrong type.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/malformed-request
            title: Malformed request
            status: 400
            detail: The request could not be parsed or contains an ill-typed value.
            instance: /api/v1/appointments
            code: MALFORMED_REQUEST
            traceId: 00000000-0000-4000-8000-000000000001
    ValidationFailed:
      description: The request body violates the schema.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/validation-error
            title: Validation failed
            status: 422
            detail: The request body contains invalid fields.
            instance: /api/v1/appointments
            code: VALIDATION_ERROR
            traceId: 00000000-0000-4000-8000-000000000002
            errors:
              - field: client.phone
                code: PATTERN_MISMATCH
                message: Phone must be in E.164-like format.
    Unauthenticated:
      description: Missing, expired or invalid credentials.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/unauthenticated
            title: Not authenticated
            status: 401
            detail: A valid bearer token is required.
            instance: /api/v1/me/appointments
            code: UNAUTHENTICATED
            traceId: 00000000-0000-4000-8000-000000000003
    Forbidden:
      description: Authenticated but not permitted for this resource or role.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/forbidden
            title: Forbidden
            status: 403
            detail: This operation requires the administrator role.
            instance: /api/v1/admin/masters
            code: FORBIDDEN
            traceId: 00000000-0000-4000-8000-000000000004
    NotFound:
      description: Unknown resource id or unknown appointment token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/not-found
            title: Not found
            status: 404
            detail: No appointment exists for the supplied access token.
            instance: /api/v1/appointments/9b2f7c1e-4a3d-4f6b-8e21-7c5a9d0b3f14
            code: NOT_FOUND
            traceId: 00000000-0000-4000-8000-000000000005
    MethodNotAllowed:
      description: The method is not defined for this path.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/method-not-allowed
            title: Method not allowed
            status: 405
            detail: DELETE is not supported on this path; deactivate with PATCH active=false.
            instance: /api/v1/admin/services/1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
            code: METHOD_NOT_ALLOWED
            traceId: 00000000-0000-4000-8000-000000000006
    SlotUnavailable:
      description: The requested slot is outside availability or already booked.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/slot-unavailable
            title: Slot unavailable
            status: 409
            detail: The requested slot is already booked for this master.
            instance: /api/v1/appointments
            code: SLOT_UNAVAILABLE
            traceId: 00000000-0000-4000-8000-000000000007
    DuplicateResource:
      description: A unique constraint would be violated.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/duplicate-resource
            title: Duplicate resource
            status: 409
            detail: A master with this username already exists.
            instance: /api/v1/admin/masters
            code: DUPLICATE_RESOURCE
            traceId: 00000000-0000-4000-8000-000000000008
    InvalidStateTransition:
      description: The requested change is not allowed in the current appointment status.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/invalid-state-transition
            title: Invalid state transition
            status: 409
            detail: A completed appointment cannot be edited or cancelled.
            instance: /api/v1/admin/appointments/7c1e4a3d-4f6b-4e21-8c5a-9d0b3f141a2b/cancel
            code: INVALID_STATE_TRANSITION
            traceId: 00000000-0000-4000-8000-000000000009
    AppointmentNotCompleted:
      description: Payment is allowed only after the appointment reaches completed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/appointment-not-completed
            title: Appointment not completed
            status: 409
            detail: A payment can be recorded only for a completed appointment.
            instance: /api/v1/admin/appointments/7c1e4a3d-4f6b-4e21-8c5a-9d0b3f141a2b/payments
            code: APPOINTMENT_NOT_COMPLETED
            traceId: 00000000-0000-4000-8000-00000000000b
    MaterialStockInsufficient:
      description: The issue quantity exceeds the current stock level.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/material-stock-insufficient
            title: Insufficient stock
            status: 409
            detail: Requested issue quantity 250 ml exceeds the current stock of 180 ml.
            instance: /api/v1/admin/materials/2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14/transactions
            code: MATERIAL_STOCK_INSUFFICIENT
            traceId: 00000000-0000-4000-8000-00000000000c
    InvalidPeriod:
      description: The period selection is ambiguous or inconsistent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/invalid-period
            title: Invalid period
            status: 422
            detail: Supply either period or both from and to, not both forms.
            instance: /api/v1/admin/reports/revenue
            code: INVALID_PERIOD
            traceId: 00000000-0000-4000-8000-00000000000d
    BusinessRuleViolation:
      description: The request is well-formed but violates a business rule.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/business-rule-violation
            title: Business rule violated
            status: 422
            detail: The requested start time must fall on a 30-minute boundary.
            instance: /api/v1/appointments
            code: BUSINESS_RULE_VIOLATION
            traceId: 00000000-0000-4000-8000-00000000000e
    UnsupportedMediaType:
      description: The request body is not application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/unsupported-media-type
            title: Unsupported media type
            status: 415
            detail: Request bodies must use application/json.
            instance: /api/v1/appointments
            code: UNSUPPORTED_MEDIA_TYPE
            traceId: 00000000-0000-4000-8000-00000000000f
    InternalError:
      description: Unexpected server failure.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.salon.example/problems/internal-error
            title: Internal error
            status: 500
            detail: An unexpected error occurred.
            instance: /api/v1/services
            code: INTERNAL_ERROR
            traceId: 00000000-0000-4000-8000-000000000010
  schemas:
    Problem:
      type: object
      description: |
        RFC 9457 Problem Details plus a stable machine-readable code and optional
        field-level errors. Every error response in this API uses this schema.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          description: Stable problem-type URI, one per code.
          example: https://api.salon.example/problems/slot-unavailable
        title:
          type: string
          description: Short human-readable summary of the error class.
          example: Slot unavailable
        status:
          type: integer
          description: HTTP status code, repeated in the body.
          example: 409
        detail:
          type: string
          description: Human-readable explanation of this occurrence.
          example: The requested slot is already booked for this master.
        instance:
          type: string
          description: Request path that produced the error.
          example: /api/v1/appointments
        code:
          type: string
          description: Stable machine-readable error code (closed enum).
          enum:
            - MALFORMED_REQUEST
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - SLOT_UNAVAILABLE
            - DUPLICATE_RESOURCE
            - INVALID_STATE_TRANSITION
            - PAYMENT_ALREADY_RECORDED
            - APPOINTMENT_NOT_COMPLETED
            - MATERIAL_STOCK_INSUFFICIENT
            - INVALID_PERIOD
            - BUSINESS_RULE_VIOLATION
            - UNSUPPORTED_MEDIA_TYPE
            - INTERNAL_ERROR
          example: SLOT_UNAVAILABLE
        traceId:
          type: string
          format: uuid
          description: Correlation id for server-log lookup.
          example: 6f1c2a8e-5b7d-4c2a-9e0f-2d3b4a5c6d7e
        errors:
          type: array
          description: Field-level validation failures; present for validation errors only.
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
    ValidationErrorItem:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Dot path to the offending field.
          example: client.phone
        code:
          type: string
          enum: [REQUIRED, PATTERN_MISMATCH, FORMAT_INVALID, ENUM_MISMATCH, OUT_OF_RANGE, UNKNOWN_FIELD]
          example: PATTERN_MISMATCH
        message:
          type: string
          example: Phone must be in E.164-like format.
    Money:
      type: object
      description: Monetary amount in integer minor units (kopiykas).
      required: [amountMinor, currency]
      properties:
        amountMinor:
          type: integer
          minimum: 0
          example: 55000
        currency:
          type: string
          enum: [UAH]
          example: UAH
    Client:
      type: object
      additionalProperties: false
      description: Client identity captured at booking; no account exists.
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Iryna Kovalenko
        phone:
          type: string
          pattern: '^\+?[0-9]{9,15}$'
          description: E.164-like phone number (D14).
          example: '+380501234567'
    MasterPublic:
      type: object
      description: Public master view; only id and full name are exposed (D19).
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: Olena Shevchenko
    Master:
      type: object
      description: Administrator and self view of a master account.
      required: [id, fullName, username, active, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
          example: Olena Shevchenko
        username:
          type: string
          example: olena
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MasterCreate:
      type: object
      additionalProperties: false
      required: [fullName, username, password]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-zA-Z0-9._-]+$'
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
        active:
          type: boolean
          default: true
    MasterPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
    Service:
      type: object
      required: [id, name, category, baseDurationMinutes, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Haircut
        category:
          type: string
          description: Free-form category name (REQ-F-024); not an enum.
          example: Hair
        baseDurationMinutes:
          type: integer
          minimum: 1
          description: Base duration; appointment totals are rounded up to 30-minute blocks (REQ-F-031).
          example: 45
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ServiceCreate:
      type: object
      additionalProperties: false
      required: [name, category, baseDurationMinutes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        category:
          type: string
          minLength: 1
          maxLength: 80
        baseDurationMinutes:
          type: integer
          minimum: 1
        active:
          type: boolean
          default: true
    ServicePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        category:
          type: string
          minLength: 1
          maxLength: 80
        baseDurationMinutes:
          type: integer
          minimum: 1
        active:
          type: boolean
    Category:
      type: object
      required: [name, seeded]
      properties:
        name:
          type: string
          example: Hair
        seeded:
          type: boolean
          description: True for the three seeded categories Hair, Coloring, Barbering.
    CategoryList:
      type: array
      items:
        $ref: '#/components/schemas/Category'
    MasterService:
      type: object
      description: Link between a master and a service; carries the price.
      required: [id, masterId, serviceId, price, active]
      properties:
        id:
          type: string
          format: uuid
        masterId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        price:
          $ref: '#/components/schemas/Money'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MasterServiceCreate:
      type: object
      additionalProperties: false
      required: [masterId, serviceId, price]
      properties:
        masterId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
        price:
          $ref: '#/components/schemas/Money'
        active:
          type: boolean
          default: true
    MasterServicePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        price:
          $ref: '#/components/schemas/Money'
        active:
          type: boolean
    Material:
      type: object
      required: [id, name, unit, stockQuantity, active]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Shampoo
        unit:
          type: string
          maxLength: 32
          description: Standard unit (ml, l, g, kg, pcs) or a custom string (REQ-F-025).
          example: ml
        stockQuantity:
          type: number
          minimum: 0
          description: Current stock in the material unit; fractional values allowed for ml, l, g and kg.
          example: 180
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    MaterialCreate:
      type: object
      additionalProperties: false
      required: [name, unit]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        unit:
          type: string
          minLength: 1
          maxLength: 32
        initialStockQuantity:
          type: number
          minimum: 0
          default: 0
        active:
          type: boolean
          default: true
    MaterialPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        unit:
          type: string
          minLength: 1
          maxLength: 32
        active:
          type: boolean
    UnitList:
      type: object
      required: [standard, custom]
      properties:
        standard:
          type: array
          items:
            type: string
            enum: [ml, l, g, kg, pcs]
        custom:
          type: array
          items:
            type: string
          description: Custom units currently in use.
    MaterialTransaction:
      type: object
      required: [id, materialId, type, quantity, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        materialId:
          type: string
          format: uuid
        type:
          type: string
          enum: [receipt, issue]
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 500
        createdAt:
          type: string
          format: date-time
    MaterialTransactionCreate:
      type: object
      additionalProperties: false
      required: [type, quantity, occurredAt]
      properties:
        type:
          type: string
          enum: [receipt, issue]
        quantity:
          type: number
          exclusiveMinimum: true
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 500
    WeeklyRule:
      type: object
      additionalProperties: false
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
          description: ISO weekday, 1 = Monday, 7 = Sunday.
          example: 1
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '09:00'
        endTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '18:00'
    DateRule:
      type: object
      additionalProperties: false
      required: [date, startTime, endTime]
      properties:
        date:
          type: string
          format: date
          example: '2026-11-03'
        startTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
        endTime:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
    Availability:
      type: object
      additionalProperties: false
      description: Weekly rules plus date-specific overrides (REQ-F-015).
      required: [weekly, dates]
      properties:
        weekly:
          type: array
          items:
            $ref: '#/components/schemas/WeeklyRule'
        dates:
          type: array
          description: Overrides for specific dates; a date rule replaces the weekly rule for that date.
          items:
            $ref: '#/components/schemas/DateRule'
    AvailabilitySlot:
      type: object
      required: [startAt, endAt, durationMinutes, available]
      properties:
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 30
          description: Rounded block occupied by the requested services (REQ-F-031).
        available:
          type: boolean
    AvailabilityResponse:
      type: object
      required: [masterId, date, serviceIds, totalDurationMinutes, occupiedDurationMinutes, slots]
      properties:
        masterId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        serviceIds:
          type: array
          items:
            type: string
            format: uuid
        totalDurationMinutes:
          type: integer
          description: Sum of service base durations before rounding.
          example: 75
        occupiedDurationMinutes:
          type: integer
          description: Sum after rounding up to a 30-minute boundary (REQ-F-031); 75 becomes 90.
          example: 90
        slots:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilitySlot'
    AppointmentService:
      type: object
      description: Service line with price and duration snapshotted at booking time.
      required: [serviceId, name, baseDurationMinutes, price]
      properties:
        serviceId:
          type: string
          format: uuid
        name:
          type: string
        baseDurationMinutes:
          type: integer
          minimum: 1
        price:
          $ref: '#/components/schemas/Money'
    Reminder:
      type: object
      required: [type, scheduledAt, status]
      properties:
        type:
          type: string
          enum: ['24h', '2h']
        scheduledAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, skipped, sent, failed]
    Payment:
      type: object
      required: [id, appointmentId, amount, status, method, recordedAt]
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [paid, unpaid]
        method:
          type: string
          enum: [cash, card]
        recordedAt:
          type: string
          format: date-time
    PaymentCreate:
      type: object
      additionalProperties: false
      required: [amount, method]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        method:
          type: string
          enum: [cash, card]
        status:
          type: string
          enum: [paid, unpaid]
          default: paid
    Appointment:
      type: object
      description: |
        Client-facing appointment view. Returns the access token and confirmation
        URL, so it is used only by token-authenticated client operations. Master
        and administrator responses use `AppointmentAdmin` (D18).
      required: [id, status, client, master, services, startAt, endAt, totalDurationMinutes, occupiedDurationMinutes, totalPrice, reminders, accessToken, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [confirmed, completed, cancelled]
        client:
          $ref: '#/components/schemas/Client'
        master:
          $ref: '#/components/schemas/MasterPublic'
        services:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AppointmentService'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        totalDurationMinutes:
          type: integer
          minimum: 1
        occupiedDurationMinutes:
          type: integer
          minimum: 30
        totalPrice:
          $ref: '#/components/schemas/Money'
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
        payment:
          $ref: '#/components/schemas/Payment'
        accessToken:
          type: string
          format: uuid
          description: Client credential for this appointment (REQ-NF-001).
        confirmationUrl:
          type: string
          format: uri
          description: Reachable confirmation page (REQ-F-004).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AppointmentAdmin:
      type: object
      description: |
        Internal staff view used by master and administrator endpoints. Excludes
        the client access token and confirmation URL (D18, REQ-NF-006).
      required: [id, status, client, master, services, startAt, endAt, totalDurationMinutes, occupiedDurationMinutes, totalPrice, reminders, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [confirmed, completed, cancelled]
        client:
          $ref: '#/components/schemas/Client'
        master:
          $ref: '#/components/schemas/MasterPublic'
        services:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AppointmentService'
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        totalDurationMinutes:
          type: integer
          minimum: 1
        occupiedDurationMinutes:
          type: integer
          minimum: 30
        totalPrice:
          $ref: '#/components/schemas/Money'
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
        payment:
          $ref: '#/components/schemas/Payment'
        notificationsSummary:
          type: object
          description: Counts of notification records for this appointment.
          properties:
            scheduled:
              type: integer
              minimum: 0
            sent:
              type: integer
              minimum: 0
            skipped:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AppointmentCreate:
      type: object
      additionalProperties: false
      required: [client, masterId, serviceIds, startAt]
      properties:
        client:
          $ref: '#/components/schemas/Client'
        masterId:
          type: string
          format: uuid
        serviceIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
        startAt:
          type: string
          format: date-time
          description: Must fall on a 30-minute boundary (REQ-NF-008).
    AppointmentReschedule:
      type: object
      additionalProperties: false
      required: [startAt]
      properties:
        startAt:
          type: string
          format: date-time
        masterId:
          type: string
          format: uuid
          description: Optional new master; omit to keep the current one.
    AppointmentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        startAt:
          type: string
          format: date-time
        masterId:
          type: string
          format: uuid
        serviceIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid
        client:
          $ref: '#/components/schemas/Client'
    Notification:
      type: object
      required: [id, audience, eventType, channel, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        appointmentId:
          type: string
          format: uuid
        audience:
          type: string
          enum: [client, master, admin]
        eventType:
          type: string
          enum: [new, reschedule, cancellation, reminder_24h, reminder_2h]
        channel:
          type: string
          enum: [sms, in_app]
        status:
          type: string
          enum: [scheduled, sent, skipped, failed]
        scheduledAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    NotificationPreference:
      type: object
      required: [channel, eventType, enabled]
      properties:
        channel:
          type: string
          enum: [sms, in_app]
        eventType:
          type: string
          enum: [new, reschedule, cancellation]
        enabled:
          type: boolean
    NotificationPreferencePatch:
      type: object
      additionalProperties: false
      description: Toggles exactly one channel and event-type combination (REQ-F-026).
      required: [channel, eventType, enabled]
      properties:
        channel:
          type: string
          enum: [sms, in_app]
        eventType:
          type: string
          enum: [new, reschedule, cancellation]
        enabled:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
