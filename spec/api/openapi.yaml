openapi: 3.0.3
info:
  title: Salon Management System API
  version: 1.0.0
  description: |
    REST API contract for a single-location unisex beauty salon.

    Clients book without an account and manage their appointment through an
    access token. Masters see their own schedule and availability. One
    administrator manages reference data, appointments, materials, payments and
    reports.

    Derived from SRS v1.3 (approved 2026-09-27). Design rationale and step
    mapping: `logs/2026-10-26-api-design-plan.md`. Resource model:
    `spec/api/resource-model.md`. Error model: `spec/api/error-model.md`.

    Conventions: base path `/api/v1`; JSON in, JSON out; errors are
    `application/problem+json` and always `Problem`; timestamps are RFC 3339 with
    offset in `Europe/Kyiv`; money is integer minor units (`UAH`); UUID v4 ids.
  contact:
    name: Salon Management System — Lab 4
servers:
  - url: http://127.0.0.1:4010/api/v1
    description: Local Prism mock. Prism serves the paths at the server root, so requests go to http://127.0.0.1:4010/services (see clarifications CL-01).
  - url: https://api.salon.example/api/v1
    description: Production (placeholder host, not provisioned).
tags:
  - name: Public
    description: Public catalogue, availability and client booking.
  - name: Auth
    description: Master and administrator authentication.
  - name: Master
    description: Master self-service endpoints.
  - name: Admin
    description: Administrator reference data and operations.
  - name: Reports
    description: Administrator reporting endpoints.
security:
  - bearerAuth: []
paths:
  /services:
    get:
      operationId: listServices
      summary: List active services
      description: Public catalogue. Returns active services, optionally filtered by category or free-text query.
      tags: [Public]
      security: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Case-insensitive substring match on the service name.
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of active services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
              example:
                items:
                  - id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: Haircut
                    category: Hair
                    baseDurationMinutes: 45
                    active: true
                    createdAt: '2026-09-01T10:00:00+03:00'
                    updatedAt: '2026-09-01T10:00:00+03:00'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /services/{serviceId}:
    get:
      operationId: getService
      summary: Get one service
      tags: [Public]
      security: []
      parameters:
        - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: The service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
              example:
                id: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                name: Haircut
                category: Hair
                baseDurationMinutes: 45
                active: true
                createdAt: '2026-09-01T10:00:00+03:00'
                updatedAt: '2026-09-01T10:00:00+03:00'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /categories:
    get:
      operationId: listCategories
      summary: List service categories
      description: Includes the three seeded categories Hair, Coloring and Barbering plus any custom ones (REQ-F-024).
      tags: [Public]
      security: []
      responses:
        '200':
          description: All categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
              example:
                - name: Hair
                  seeded: true
                - name: Coloring
                  seeded: true
                - name: Barbering
                  seeded: true
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /masters:
    get:
      operationId: listMasters
      summary: List masters
      tags: [Public]
      security: []
      parameters:
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of masters in public representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterPage'
              example:
                items:
                  - id: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                    fullName: Olena Shevchenko
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /masters/{masterId}:
    get:
      operationId: getMaster
      summary: Get one master
      tags: [Public]
      security: []
      parameters:
        - $ref: '#/components/parameters/MasterId'
      responses:
        '200':
          description: The master in public representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterPublic'
              example:
                id: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                fullName: Olena Shevchenko
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /masters/{masterId}/services:
    get:
      operationId: listMasterServices
      summary: List services offered by a master
      tags: [Public]
      security: []
      parameters:
        - $ref: '#/components/parameters/MasterId'
        - name: active
          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of master-service links with prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterServicePage'
              example:
                items:
                  - id: 4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f80
                    masterId: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                    serviceId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    price:
                      amountMinor: 55000
                      currency: UAH
                    active: true
                page: 1
                pageSize: 20
                total: 1
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /masters/{masterId}/availability:
    get:
      operationId: getMasterAvailability
      summary: Get bookable slots for a date
      description: |
        Computes slots from the master's weekly rules and date overrides, filters
        out booked time, and applies 30-minute rounding (REQ-F-031) and the
        boundary rule (REQ-NF-008).
      tags: [Public]
      security: []
      parameters:
        - $ref: '#/components/parameters/MasterId'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: serviceIds
          in: query
          required: true
          description: Comma-separated service ids that define the requested duration.
          schema:
            type: string
          example: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
      responses:
        '200':
          description: Availability for the date.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
              example:
                masterId: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                date: '2026-11-03'
                serviceIds:
                  - 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                totalDurationMinutes: 75
                occupiedDurationMinutes: 90
                slots:
                  - startAt: '2026-11-03T10:00:00+02:00'
                    endAt: '2026-11-03T11:30:00+02:00'
                    durationMinutes: 90
                    available: true
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
        '500':
          $ref: '#/components/responses/InternalError'
  /appointments:
    post:
      operationId: createAppointment
      summary: Book an appointment
      description: |
        Creates a confirmed appointment with no approval step (REQ-F-003), sends
        exactly one confirmation message (REQ-F-005), schedules reminders at the
        appointment time minus 24 h and 2 h, skipping those already in the past
        (REQ-F-010, REQ-F-011).
      tags: [Public]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreate'
            example:
              client:
                name: Iryna Kovalenko
                phone: '+380501234567'
              masterId: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
              serviceIds:
                - 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                - 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
              startAt: '2026-11-03T10:00:00+02:00'
      responses:
        '201':
          description: Appointment created and confirmed.
          headers:
            Location:
              description: URL of the created appointment, containing the access token.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: 7c1e4a3d-4f6b-4e21-8c5a-9d0b3f141a2b
                status: confirmed
                client:
                  name: Iryna Kovalenko
                  phone: '+380501234567'
                master:
                  id: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                  fullName: Olena Shevchenko
                services:
                  - serviceId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: Haircut
                    baseDurationMinutes: 45
                    price:
                      amountMinor: 55000
                      currency: UAH
                  - serviceId: 5a6b7c8d-9e0f-4a1b-8c2d-3e4f5a6b7c8d
                    name: Styling
                    baseDurationMinutes: 30
                    price:
                      amountMinor: 30000
                      currency: UAH
                startAt: '2026-11-03T10:00:00+02:00'
                endAt: '2026-11-03T11:30:00+02:00'
                totalDurationMinutes: 75
                occupiedDurationMinutes: 90
                totalPrice:
                  amountMinor: 85000
                  currency: UAH
                reminders:
                  - type: '24h'
                    scheduledAt: '2026-11-02T10:00:00+02:00'
                    status: scheduled
                  - type: '2h'
                    scheduledAt: '2026-11-03T08:00:00+02:00'
                    status: scheduled
                accessToken: 9b2f7c1e-4a3d-4f6b-8e21-7c5a9d0b3f14
                confirmationUrl: https://salon.example/appointments/9b2f7c1e-4a3d-4f6b-8e21-7c5a9d0b3f14
                createdAt: '2026-10-26T12:00:00+02:00'
                updatedAt: '2026-10-26T12:00:00+02:00'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '409':
          $ref: '#/components/responses/SlotUnavailable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /appointments/{token}:
    get:
      operationId: getAppointmentByToken
      summary: Get an appointment by access token
      description: The token is the credential; an unknown token never reveals whether it existed.
      tags: [Public]
      security: []
      parameters:
        - $ref: '#/components/parameters/AccessToken'
      responses:
        '200':
          description: The appointment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: 7c1e4a3d-4f6b-4e21-8c5a-9d0b3f141a2b
                status: confirmed
                client:
                  name: Iryna Kovalenko
                  phone: '+380501234567'
                master:
                  id: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                  fullName: Olena Shevchenko
                services:
                  - serviceId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: Haircut
                    baseDurationMinutes: 45
                    price:
                      amountMinor: 55000
                      currency: UAH
                startAt: '2026-11-03T10:00:00+02:00'
                endAt: '2026-11-03T11:30:00+02:00'
                totalDurationMinutes: 75
                occupiedDurationMinutes: 90
                totalPrice:
                  amountMinor: 85000
                  currency: UAH
                reminders:
                  - type: '24h'
                    scheduledAt: '2026-11-02T10:00:00+02:00'
                    status: scheduled
                  - type: '2h'
                    scheduledAt: '2026-11-03T08:00:00+02:00'
                    status: scheduled
                accessToken: 9b2f7c1e-4a3d-4f6b-8e21-7c5a9d0b3f14
                confirmationUrl: https://salon.example/appointments/9b2f7c1e-4a3d-4f6b-8e21-7c5a9d0b3f14
                createdAt: '2026-10-26T12:00:00+02:00'
                updatedAt: '2026-10-26T12:00:00+02:00'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /appointments/{token}/cancel:
    post:
      operationId: cancelAppointmentByToken
      summary: Cancel an appointment by access token
      description: |
        Cancelling an already cancelled appointment returns the current state
        unchanged (D15). Cancelling a completed appointment is rejected.
      tags: [Public]
      security: []
      parameters:
        - $ref: '#/components/parameters/AccessToken'
      responses:
        '200':
          description: Appointment after cancellation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: 7c1e4a3d-4f6b-4e21-8c5a-9d0b3f141a2b
                status: cancelled
                client:
                  name: Iryna Kovalenko
                  phone: '+380501234567'
                master:
                  id: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                  fullName: Olena Shevchenko
                services:
                  - serviceId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: Haircut
                    baseDurationMinutes: 45
                    price:
                      amountMinor: 55000
                      currency: UAH
                startAt: '2026-11-03T10:00:00+02:00'
                endAt: '2026-11-03T11:30:00+02:00'
                totalDurationMinutes: 75
                occupiedDurationMinutes: 90
                totalPrice:
                  amountMinor: 85000
                  currency: UAH
                reminders:
                  - type: '24h'
                    scheduledAt: '2026-11-02T10:00:00+02:00'
                    status: skipped
                accessToken: 9b2f7c1e-4a3d-4f6b-8e21-7c5a9d0b3f14
                confirmationUrl: https://salon.example/appointments/9b2f7c1e-4a3d-4f6b-8e21-7c5a9d0b3f14
                createdAt: '2026-10-26T12:00:00+02:00'
                updatedAt: '2026-10-26T12:05:00+02:00'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidStateTransition'
        '500':
          $ref: '#/components/responses/InternalError'
  /appointments/{token}/reschedule:
    post:
      operationId: rescheduleAppointmentByToken
      summary: Reschedule an appointment by access token
      description: |
        Updates the same record, recalculating totals and reminders (REQ-F-007,
        REQ-F-008). A reminder that was skipped is reactivated if the new time
        puts it in the future (REQ-F-029).
      tags: [Public]
      security: []
      parameters:
        - $ref: '#/components/parameters/AccessToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentReschedule'
            example:
              startAt: '2026-11-04T14:00:00+02:00'
      responses:
        '200':
          description: Appointment after rescheduling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
              example:
                id: 7c1e4a3d-4f6b-4e21-8c5a-9d0b3f141a2b
                status: confirmed
                client:
                  name: Iryna Kovalenko
                  phone: '+380501234567'
                master:
                  id: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                  fullName: Olena Shevchenko
                services:
                  - serviceId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                    name: Haircut
                    baseDurationMinutes: 45
                    price:
                      amountMinor: 55000
                      currency: UAH
                startAt: '2026-11-04T14:00:00+02:00'
                endAt: '2026-11-04T15:30:00+02:00'
                totalDurationMinutes: 75
                occupiedDurationMinutes: 90
                totalPrice:
                  amountMinor: 85000
                  currency: UAH
                reminders:
                  - type: '24h'
                    scheduledAt: '2026-11-03T14:00:00+02:00'
                    status: scheduled
                  - type: '2h'
                    scheduledAt: '2026-11-04T12:00:00+02:00'
                    status: scheduled
                accessToken: 9b2f7c1e-4a3d-4f6b-8e21-7c5a9d0b3f14
                confirmationUrl: https://salon.example/appointments/9b2f7c1e-4a3d-4f6b-8e21-7c5a9d0b3f14
                createdAt: '2026-10-26T12:00:00+02:00'
                updatedAt: '2026-10-26T12:10:00+02:00'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SlotUnavailable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate a master or administrator
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: olena
              password: correct-horse-battery
      responses:
        '200':
          description: Bearer token for subsequent requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example
                tokenType: Bearer
                expiresIn: 3600
                role: master
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getCurrentPrincipal
      summary: Get the authenticated principal
      tags: [Auth]
      responses:
        '200':
          description: The caller's identity and role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Principal'
              example:
                id: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                role: master
                displayName: Olena Shevchenko
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/appointments:
    get:
      operationId: listMyAppointments
      summary: List the caller's own appointments
      description: Master-only. The scope is derived from the token subject (REQ-F-013).
      tags: [Master]
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [confirmed, completed, cancelled]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: A page of the caller's appointments in staff representation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentAdminPage'
              example:
                items:
                  - id: 7c1e4a3d-4f6b-4e21-8c5a-9d0b3f141a2b
                    status: confirmed
                    client:
                      name: Iryna Kovalenko
                      phone: '+380501234567'
                    master:
                      id: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                      fullName: Olena Shevchenko
                    services:
                      - serviceId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                        name: Haircut
                        baseDurationMinutes: 45
                        price:
                          amountMinor: 55000
                          currency: UAH
                    startAt: '2026-11-03T10:00:00+02:00'
                    endAt: '2026-11-03T11:30:00+02:00'
                    totalDurationMinutes: 75
                    occupiedDurationMinutes: 90
                    totalPrice:
                      amountMinor: 85000
                      currency: UAH
                    reminders:
                      - type: '24h'
                        scheduledAt: '2026-11-02T10:00:00+02:00'
                        status: scheduled
                    createdAt: '2026-10-26T12:00:00+02:00'
                    updatedAt: '2026-10-26T12:00:00+02:00'
                page: 1
                pageSize: 20
                total: 1
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/services:
    get:
      operationId: listMyServices
      summary: List services the caller provides
      description: Master-only; returns only the caller's own MasterService records (REQ-F-014).
      tags: [Master]
      responses:
        '200':
          description: The caller's master-service links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterServiceList'
              example:
                - id: 4d5e6f7a-8b9c-4d0e-1f2a-3b4c5d6e7f80
                  masterId: 2f7c1e4a-3d4f-4b6b-8e21-7c5a9d0b3f14
                  serviceId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e5f
                  price:
                    amountMinor: 55000
                    currency: UAH
                  active: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
